name: Nightly

on:
  schedule:
    # 07:00 UTC daily, after most work has landed on main.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force_gate_failure:
        description: Test control - fail the gate's first step.
        type: boolean
        default: false
      stop_at:
        description: Test control - exit non-zero right after this point in publication.
        type: choice
        options: [none, before_promote, after_4_1, after_4_3]
        default: none
      force_republish:
        description: Treat an already-published commit as unpublished and rebuild it.
        type: boolean
        default: false

# Serialize runs so two never stage or promote at once.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      force_failure: ${{ (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.force_gate_failure) || false }}

  publish:
    # Dispatches from other branches run the gate only and never publish.
    if: github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Test controls are honored only for the repository owner's manual
      # dispatches; scheduled runs and other actors always get the defaults.
      STOP_AT: ${{ (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.stop_at) || 'none' }}
      FORCE_REPUBLISH: ${{ (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.force_republish) || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        # GoReleaser's `sboms:` block shells out to syft; it is not bundled.
        uses: anchore/sbom-action/download-syft@v0

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: Publish nightly
        # Staged publication and recovery; see scripts/nightly-publish.sh.
        run: ./scripts/nightly-publish.sh
